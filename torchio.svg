<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 8 126 106" width="126" height="106" role="img" aria-label="Torchio">
  <style>
    .hair { stroke: #1B1B1B; stroke-width: 1.3; stroke-linecap: round; fill: none; }
    .dot { fill: #1B1B1B; }
    .wheel { transform-origin: 104px 60px; animation: turn 26s linear infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .wheel { animation: none; } }
  </style>

  <!-- frame -->
  <path class="hair" d="M40 14 H92"/>
  <path class="hair" d="M46 14 V103"/>
  <path class="hair" d="M86 14 V103"/>
  <path class="hair" d="M38 107 H58"/>
  <path class="hair" d="M74 107 H94"/>
  <circle class="hair" cx="66" cy="59.5" r="9"/>
  <circle class="dot" cx="66" cy="59.5" r="1.1"/>
  <path class="hair" d="M18 70 H126"/>
  <path class="hair" d="M24 74 H120"/>
  <g class="wheel">
    <circle class="dot" cx="104" cy="60" r="2.4"/>
    <g class="hair">
      <path d="M104 60 Q117.7 69.2 132.2 70.3"/>
      <path d="M104 60 Q102.8 76.5 109.2 89.5"/>
      <path d="M104 60 Q89.2 67.2 81 79.3"/>
      <path d="M104 60 Q90.3 50.8 75.8 49.7"/>
      <path d="M104 60 Q105.2 43.5 98.8 30.5"/>
      <path d="M104 60 Q118.8 52.8 127 40.7"/>
    </g>
    <circle class="dot" cx="132.2" cy="70.3" r="1.6"/>
    <circle class="dot" cx="109.2" cy="89.5" r="1.6"/>
    <circle class="dot" cx="81" cy="79.3" r="1.6"/>
    <circle class="dot" cx="75.8" cy="49.7" r="1.6"/>
    <circle class="dot" cx="98.8" cy="30.5" r="1.6"/>
    <circle class="dot" cx="127" cy="40.7" r="1.6"/>
  </g>

</svg>
